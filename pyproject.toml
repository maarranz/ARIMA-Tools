[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ARIMA-Tools"
dynamic = ["version"]
description = "Teaching-oriented tools for empirical ARIMA modelling"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=2.0,<3",
    "scipy>=1.13,<2",
    "pandas>=2.2.2,<3",
    "statsmodels>=0.14.6,<0.16",
    "statsforecast>=2.1.1,<2.2",
    "plotly>=5.24.1,<8",
]

[project.optional-dependencies]
test = ["pytest>=9"]

[project.urls]
Repository = "https://github.com/maarranz/ARIMA-Tools"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["arima_tools", "arima_tools.*"]
namespaces = false

[tool.setuptools.dynamic]
version = {attr = "arima_tools.__version__"}
